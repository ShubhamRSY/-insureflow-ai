version: "3.9"

x-api-env: &api-env
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_CHEAP_API_KEY: ${LLM_CHEAP_API_KEY:-}
  LLM_EXPENSIVE_API_KEY: ${LLM_EXPENSIVE_API_KEY:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_CHEAP_MODEL: ${LLM_CHEAP_MODEL:-gpt-4o-mini}
  LLM_EXPENSIVE_MODEL: ${LLM_EXPENSIVE_MODEL:-gpt-4o}
  DATABASE_URL: postgresql://insureflow:${POSTGRES_PASSWORD:-insureflow}@db:5432/insureflow
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  JOB_STORE_BACKEND: redis
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_TO_A_LONG_SECRET_KEY_IN_PRODUCTION}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  BANK_MODE: ${BANK_MODE:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-insureflow-evals}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
  CLOUDWATCH_LOGS: ${CLOUDWATCH_LOGS:-false}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_SECRETS_ARN: ${AWS_SECRETS_ARN:-}
  PYTHONPATH: /app
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  METRICS_BACKEND: ${METRICS_BACKEND:-redis}
  INSURANCE_USE_CELERY: ${INSURANCE_USE_CELERY:-1}
  PROMETHEUS_MULTIPROC_DIR: /tmp/rytera-prom
  METRICS_BEARER: ${METRICS_BEARER:-}
  OPENOBSERVE_ENABLED: ${OPENOBSERVE_ENABLED:-true}
  OPENOBSERVE_URL: ${OPENOBSERVE_URL:-http://openobserve:5080}
  OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
  OPENOBSERVE_USER: ${ZO_ROOT_USER_EMAIL:-root@example.com}
  OPENOBSERVE_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
  GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: celery -A insureflow.tasks.celery_app worker -Q agents,pipeline,mortgage -l info --concurrency=2
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-rytera}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    ports:
      - "5080:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
      ZO_COMPACT_DATA_RETENTION_DAYS: "14"
    volumes:
      - oo-data:/data
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=insureflow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-insureflow}
      - POSTGRES_DB=insureflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  oo-data:
