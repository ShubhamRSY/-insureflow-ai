[project]
name = "insureflow-ai"
version = "0.3.1"
description = "Autonomous agentic pipeline for commercial underwriting data ingestion, reconciliation, and synthesis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-xml>=2.0",
    "lxml>=5.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "mcp>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "langgraph>=0.2",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "pdfminer.six>=20221105",
    "celery>=5.3",
    "slowapi>=0.1",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "prometheus_client>=0.21",
    "polars>=1.0",
    "instructor>=1.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "pdf2image>=1.16",
]
claude = [
    "anthropic>=0.30",
]
pgvector = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "sqlalchemy>=2.0",
]
eval = [
    "ragas>=0.4",
    "giskard[litellm]>=2.19",
    "datasets>=2.0",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langsmith>=0.1",
    "mlflow>=2.14",
    "deepeval>=0.21",
    "arize-phoenix>=4.6",
    "openinference-instrumentation-openai>=0.1",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "psycopg2-binary>=2.9",
]
aws = [
    "boto3>=1.34",
]
sftp = [
    "paramiko>=3.4",
]
ml = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "spacy>=3.7",
    "en-core-web-sm>=3.7",
]
vector = [
    "chromadb>=0.4",
    "weaviate-client>=4.0",
]
cloud-ocr = [
    "boto3>=1.34",
    "google-cloud-documentai>=2.20",
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]
vision = [
    "torch>=2.0",
    "transformers>=4.40",
]
llamaparse = [
    "llama-parse>=0.5",
]
vlm = [
    "openai>=1.0",
    "anthropic>=0.30",
    "mistralai>=1.0",
]
docling = [
    "docling>=2.0",
]
marker = [
    "marker-pdf>=1.0",
]
pdf = [
    "weasyprint>=60.0",
    "pymupdf>=1.24",
]

[project.scripts]
insureflow = "insureflow.cli:app"
insureflow-mcp = "insureflow.mcp.server:run_server"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["insureflow*", "evaluations*"]

[tool.ruff]
target-version = "py311"
line-length = 200
exclude = ["-insureflow-ai"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/insureflow/rag/guidelines.py" = ["E501"]
"src/insureflow/rating/quote_document.py" = ["E501"]
"scripts/build_landing.py" = ["E501"]
"src/insureflow/ml/*.py" = ["N803", "N806", "N817"]
"tests/test_ml.py" = ["N806", "E402"]
"tests/test_hardening_wave.py" = ["N806"]
"evaluations/ragas_eval.py" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end integration tests",
]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
# Top-level scripts/ has runpy shims that collide with scripts/ops and
# scripts/pilot (same basename → duplicate module). CI type-checks src/ tests/.
exclude = [
    "(^|/)scripts/",
    "(^|/)external_data/",
    "(^|/)frontend/",
    "(^|/)\\.venv",
    "(^|/)venv/",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["evaluations.ragas_eval", "evaluations.giskard_eval"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["insureflow.mcp.server"]
ignore_errors = true

# ML modules are excluded from the strict gate: numpy>=2.x generics (ndarray
# type-arg) and anthropic SDK union types drift independently of this repo and
# produce only noise here. Kept checked for lint/tests; revisit when deps pin.
[[tool.mypy.overrides]]
module = ["insureflow.ml.*"]
ignore_errors = true

# Optional third-party eval SDK adapters: deepeval is only installed on eval
# environments, so mypy resolves it to Any (ignore_missing_imports) and flags the
# SDK-specific ignores as unused. Keep them so they bite when the SDK is present.
[[tool.mypy.overrides]]
module = ["evaluations.frameworks.deepeval_suite"]
warn_unused_ignores = false
