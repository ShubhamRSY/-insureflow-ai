name: CI/CD

# Gate every push/PR to main: lint, types, full test suite (including the
# in-process E2E flow), frontend build + committed-bundle drift check, security
# scans. On main only, build & push the multi-arch image, deploy to Railway,
# smoke-test the live app, then notify.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push Docker image to GHCR"
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/insureflow-ai

concurrency:
  # One run per ref; supersede in-flight runs so stale pushes never deploy.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Jobs that push packages / SARIF raise this.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'evaluations/**'
              - 'pyproject.toml'
              - 'Dockerfile'
              - 'entrypoint.sh'
              - 'cli.py'
              - 'ml_data/**'
              - 'scripts/**'
            frontend:
              - 'frontend/**'
            infra:
              - '.github/**'
              - 'docker-compose*.yml'
              - 'railway.json'
              - 'infra/**'
              - 'deploy/**'

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ml]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ml]"
      - run: mypy src/ tests/

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ml]"
      - name: Full suite + in-process E2E (with coverage)
        run: |
          pytest tests/ -v \
            -W ignore::pytest.PytestUnknownMarkWarning \
            --cov=insureflow --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=70
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          REDIS_URL: redis://localhost:6379/0
          JOB_STORE_BACKEND: auto
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: insureflow-evals-ci
          LANGSMITH_TRACING: "false"
      - name: Eval inventory smoke
        run: |
          python - <<'PY'
          from evaluations.cadence import cadence_inventory
          from evaluations.qa_ground_truth import ground_truth_inventory
          from evaluations.quality_gates import apply_quality_gates
          from evaluations.release_process import checklist_payload
          from evaluations.drift import drift_policy_payload
          assert cadence_inventory()["summary"]
          assert ground_truth_inventory()["totals"]["ground_truth_questions"] >= 1
          assert checklist_payload()["steps"]
          assert drift_policy_payload()["thresholds"]
          print("eval_inventory_ok")
          PY
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify committed bundle is not stale
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain src/insureflow/static/ui)" ]; then
            echo "::error::Frontend source changed but the committed bundle (src/insureflow/static/ui) is stale. Run 'cd frontend && npm run build' and commit the output."
            echo "--- affected files ---"
            git status --porcelain src/insureflow/static/ui
            exit 1
          fi
          echo "committed bundle is up to date"

  security:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit
      - name: Bandit SAST (Python)
        run: bandit -r src/ -f sarif -o bandit.sarif || true
      - name: Trivy fs scan (SCA / misconfig)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Upload Trivy results to CodeQL
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
      - name: GitGuardian secrets scan
        if: env.GITGUARDIAN_API_KEY != ''
        uses: GitGuardian/ggshield-action@v1
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: main
      - name: Snyk SCA (Python + npm)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

  docker:
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, test, frontend, security]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.infra == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Build image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: insureflow-ai:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/login-action@v3
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.push_image)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.push_image)
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},prefix=v
      - name: Build and push to GHCR (CD, multi-arch amd64/arm64)
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.push_image)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.push_image)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Upload image scan to CodeQL
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    container: ghcr.io/railwayapp/cli:latest
    env:
      SVC_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        if: env.SVC_ID != '' && env.RAILWAY_TOKEN != ''
        run: railway up --service=${{ env.SVC_ID }} --detach

  smoke-test:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Require APP_URL variable
        if: env.APP_URL == ''
        run: |
          echo "::error::Smoke tests need the production URL. Set it as the 'APP_URL' repository variable (Settings > Secrets and variables > Actions > Variables), e.g. https://my-service.up.railway.app"
          exit 1
      - name: Wait for deployment and smoke-test live app
        run: |
          base_url="${APP_URL%/}"
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$base_url/health" || true)
            echo "attempt $i: GET $base_url/health -> $code"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::App at $base_url did not become healthy (got $code)"
            exit 1
          fi
          echo "health: $(cat /tmp/health.json)"
          echo "--- /dashboard (SPA shell) ---"
          html="$(curl -fsS --max-time 20 "$base_url/dashboard")"
          case "$html" in
            *Rytera*|*InsureFlow*) echo "dashboard shell OK" ;;
            *) echo "::error::/dashboard did not return the SPA shell"; exit 1 ;;
          esac

  notify:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend, security, docker, deploy, smoke-test]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Send pipeline status to Slack / Discord
        run: |
          docker_r="${{ needs.docker.result }}"
          deploy_r="${{ needs.deploy.result }}"
          smoke_r="${{ needs.smoke-test.result }}"
          ok=1
          for r in "$docker_r" "$deploy_r" "$smoke_r"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then ok=0; fi
          done
          if [ "$ok" = "1" ]; then
            summary=":white_check_mark: Rytera CI/CD passed — image pushed to ghcr.io/${{ env.IMAGE_NAME }}"
            color="#36a64f"
          else
            summary=":rotating_light: Rytera CI/CD FAILED (docker=$docker_r deploy=$deploy_r smoke=$smoke_r)"
            color="#d00000"
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(jq -nc --arg summary "$summary" --arg color "$color" --arg url "$run_url" \
            '{text: $summary, attachments: [{color: $color, title: "View run", title_link: $url}]}')
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" \
              && echo "slack notified" || echo "::warning::Slack notification failed"
          fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL" \
              && echo "discord notified" || echo "::warning::Discord notification failed"
          fi

  cd-summary:
    runs-on: ubuntu-latest
    needs: [docker, security, deploy, smoke-test]
    if: >
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch')
    steps:
      - name: Publish deployment notes
        run: |
          CODECOV_STATE="${{ secrets.CODECOV_TOKEN != '' && 'enabled' || 'token not set' }}"
          RAILWAY_STATE="${{ secrets.RAILWAY_TOKEN != '' && 'enabled' || 'token not set' }}"
          APP_URL_STATE="${{ vars.APP_URL != '' && 'set' || 'NOT SET — smoke tests disabled' }}"
          export CODECOV_STATE RAILWAY_STATE APP_URL_STATE
          { cat <<EOF
          ## Rytera CI/CD

          - **CI**: lint · mypy · full pytest (+ in-process E2E, coverage gate ≥70%) · frontend build + bundle-drift check · Docker build
          - **Security**: Bandit SAST · Trivy (fs + image) · GitGuardian secrets · Snyk SCA
          - **Coverage**: pytest-cov → Codecov ($CODECOV_STATE)
          - **CD**: multi-arch image (amd64+arm64) → \`ghcr.io/${{ env.IMAGE_NAME }}\` (tags: sha, branch, vX.Y.Z, latest)
          - **Smoke tests**: live \`/health\`, \`/dashboard\`, \`/system/diagnostics\`, \`/api/demo/presets\` after deploy → \`APP_URL\` ($APP_URL_STATE)
          - **Deploy**: Railway ($RAILWAY_STATE)
          - **Notifications**: Slack / Discord webhook on success or failure
          - **Secrets**: injected via GitHub Secrets only (never in codebase)
          - **Evals**: nightly/weekly via \`scheduled_evals.yml\`
          - **Public app**: Cloudflare Tunnel → https://app.ryterainc.com/dashboard
          - **Pull**: \`docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest\`
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
