global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rytera-api
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: insureflow-api

  # Local `insureflow serve` (host) — ignored when only compose API is up.
  - job_name: rytera-api-host
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["host.docker.internal:8002"]
        labels:
          service: insureflow-api-host

remote_write:
  - url: http://openobserve:5080/api/default/prometheus/api/v1/write
    basic_auth:
      username: root@example.com
      password: Complexpass#123
    queue_config:
      max_samples_per_send: 1000
      batch_send_deadline: 5s
      min_backoff: 1s
      max_backoff: 30s
