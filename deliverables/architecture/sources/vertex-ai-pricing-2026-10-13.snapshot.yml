                  - generic [ref=e961]:
                    - paragraph [ref=e962]: "* Promotional pricing provided through 50% credits back on net spend on select models within a given period."
                    - paragraph [ref=e963]: "** Live API Billing Details:"
                    - paragraph [ref=e964]: "Session Context Window: tokens consumption is calculated per turn (defined as one user input and the model's corresponding response). Users are charged for all tokens present in the Session Context Window during that turn."
                    - paragraph [ref=e965]: "Tokens accumulation: The context window includes new tokens for the current turn plus all accumulated tokens from previous turns. Tokens from past turns are re-processed and billed in every new turn, up to the configured context window size limit."
                    - paragraph [ref=e966]: "Token Conversion Rates: To help users estimate costs, the following conversion metrics apply:"
                    - list [ref=e967]:
                      - listitem [ref=e968]: "Audio: 25 tokens /second of audio."
                      - listitem [ref=e969]: "Image Input: 258 tokens per image."
                      - listitem [ref=e970]: "Avatar Video Output: 6,192 tokens /second of video. Video output charges only apply when the avatar is actively speaking; users are not billed for idle time (when avatar is listening)."
                      - listitem [ref=e971]: "Audio-to-Text Transcription: charged at the standard text output rate for all text tokens generated when transcription is enabled."
                    - paragraph [ref=e972]:
                      - text: "Thinking Tokens: To audit how many thinking tokens a specific request used, review the"
                      - emphasis [ref=e974]: thoughts
                      - text: field within the API response metadata.
          - generic [ref=e975]:
            - paragraph [ref=e981]: Pricing with grounding
            - generic [ref=e982]:
              - generic [ref=e985]:
                - text: Show discount options
                - switch "Show discount options" [ref=e988] [cursor=pointer]
              - region "Pricing Table 0" [ref=e993]:
                - table [ref=e994]:
                  - row [ref=e995]:
                    - columnheader [ref=e996]:
                      - paragraph [ref=e998]: Feature
                    - columnheader [ref=e999]:
                      - paragraph [ref=e1001]: Usage
                    - columnheader [ref=e1002]:
                      - paragraph [ref=e1004]: Price (USD)
                  - rowgroup [ref=e1005]:
                    - row [ref=e1006]:
                      - cell [ref=e1007]:
                        - paragraph [ref=e1008]: Grounding with Google Search & Web Grounding for Enterprise
                      - cell [ref=e1009]:
                        - paragraph [ref=e1010]: Includes 5,000 Grounding Queries per month at no charge, aggregated across all Gemini 3 and Gemini 4 models.
                        - paragraph [ref=e1011]: Grounding Queries exceeding those limits are billed at $14 per 1,000 Grounding Queries. Please contact your account team if you require more than 1 million Grounding Prompts per day.
                        - paragraph [ref=e1012]: A “Grounding Prompt” is an End User prompt that Customer submits to Gemini for which Gemini makes one or more queries to a Google web index (each a “Grounding Query”) . You will be charged for each individual Grounding Query performed. Billing will start January 5, 2026.
                        - paragraph [ref=e1013]: Input tokens provided by Grounding with Google Search or Web Grounding for Enterprise are not charged.
                        - paragraph [ref=e1014]: Customers may decide not to display Search Suggestions with Grounded Results in their Customer Applications at standard pricing for under 1 million Grounding Prompts per day.
