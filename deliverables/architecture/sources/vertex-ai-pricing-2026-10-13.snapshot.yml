            - paragraph [ref=e4255]: "* For non-global endpoints, pricing will go into effect for the Generally available Gemini 3 and later families of all Google models starting on July 1, 2026. Before July 1, 2026, Global endpoint pricing applies to Non-global endpoints."
          - generic [ref=e4256]:
            - generic [ref=e4259]:
              - heading [level=3] [ref=e4260]:
                - paragraph [ref=e4262]: Example cost calculation
              - generic [ref=e4264]:
                - paragraph [ref=e4265]: A user needs to ensure they can support 10 queries per second (QPS) of a query with input of 1,000 text tokens and 500 audio tokens and receive an output of 300 text tokens using gemini-2.0-flash.
                - paragraph [ref=e4266]:
                  - text: Using the throughput and burndown rate
                  - link "table" [ref=e4268] [cursor=pointer]:
                    - /url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput/supported-models.md
                  - text: ", for gemini-2.0-flash we know an input text token's burndown rate is 1 token, an input audio token's burndown rate is 7 tokens, and an output text token's burndown rate is 4 tokens."
                - paragraph [ref=e4269]: The user's total input tokens is 1,000* (1 token per input text token) + 500* (7 tokens per input audio token) = 4,500 burndown adjusted input tokens. The user's total output tokens is 300* (4 tokens per output text token) = 1,200 burndown adjusted output tokens. Adding them together gives us 4,500 burndown adjusted input tokens + 1,200 burndown adjusted output tokens = 5,700 total tokens per query.
                - paragraph [ref=e4270]: Multiplying the total tokens per query by QPS gives us 5,700 total tokens per query * 10 QPS = 57,000 total tokens per second.
                - paragraph [ref=e4271]: Dividing this by the total throughput per second per GSU gives us 57,000 total tokens per second ÷ 3,360 per-second throughput per GSU = 16.96 GSUs. The minimum GSU purchase increment for this model is 1, so the user would need 17 GSUs.
                - paragraph [ref=e4272]: If the user wanted to sustain this throughput for 1 week, it would cost $1,200 * 17 GSUs = $20,400 per week. If they wanted to sustain this throughput for 1 month, it would cost $2,700 * 17 GSUs = $45,900 per month. If they wanted to sustain this throughput for 3 months, it would cost $2,400 * 17 GSUs = $40,800 per month. And finally, if they wanted to sustain this throughput for 1 year, it would cost $2,000 * 17 GSUs = $34,000 per month.
            - generic [ref=e4275]:
              - heading [level=3] [ref=e4276]:
                - paragraph [ref=e4278]: 50% Promotional Credits on Gemini 3.8 Flash, Gemini 3.7 Flash and Gemini 3.6 Flash Provisioned Throughput Usage
              - generic [ref=e4280]:
                - paragraph [ref=e4281]: Effective August 13, 2026 through December 31, 2026, Google Cloud is injecting a monthly billing credit equal to 50% of net eligible Provisioned Throughput spending on Gemini 3.8 Flash, Gemini 3.7 Flash, and Gemini 3.6 Flash models.
                - paragraph [ref=e4282]: This credit will automatically be reflected in monthly invoices and will not alter Provisioned Throughput configurations or commitment burndown rates.
                - paragraph [ref=e4283]:
                  - text: Issued credits apply to usage across On-Demand Gemini 3.8 Flash, Gemini 3.7 Flash and Gemini 3.6 Flash SKUs, as well as Provisioned Throughput SKUs across all models. Credits are issued on the 7th day of each month following the billing period, and expire 30 days after issuance, under standard
                  - link "Google Cloud Credit Terms of Service" [ref=e4284] [cursor=pointer]:
                    - /url: https://cloud.google.com/terms/open-source-software-tos
                  - text: . Spend for the initial month is pro-rated strictly for active usage between August 13 and August 31, 2026.
