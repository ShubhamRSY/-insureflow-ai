            - list [ref=e1384]:
              - listitem [ref=e1385]: "LiveAPI Session's Context Window billing explained: You are charged per turn for all tokens present in the Session Context Window. The Session Context Window includes new tokens (current turn) + all accumulated tokens from previous turns. This means tokens from past turns are re-processed and accounted for in each new turn, up to your configured context window size. A \"turn\" is one user input and the model's response."
